  sudime:sudime_drawer:
    data:
      item_name: "<!i><gradient:#e0aaff:#7b2cbf>Drawer en Sudime</gradient>"
      lore:
        - "<!i><gray>Stocke massivement jusqu'à <white>4 types d'items</white>."
        - "<!i><gray>1 compartiment au départ, 4 maximum."
        - "<!i><gray>1 280 items par compartiment."
        - "<!i> "
        - "<!i><light_purple>✦ Utilisation"
        - "<!i><gray>• Clic droit : déposer l'item en main"
        - "<!i><gray>• Clic gauche : retirer une pile"
        - "<!i><gray>• Maj + clic gauche : tout retirer"
        - "<!i><gray>• Clique sur un des 4 quartiers pour choisir"
        - "<!i><gray>• Clic droit avec un <white>Upgrade de Drawer</white>"
        - "<!i><gray>  pour débloquer un compartiment"
    model: minecraft:block/custom/drawer_block
    behavior:
      type: block_item
      block:
        loot:
          template: default:loot_table/self
        settings:
          template:
            - default:sound/wood
            - default:hardness/wood
          overrides:
            instrument: bass
            tags: ["minecraft:mineable/axe"]
        states:
          properties:
            facing:
              type: 4-direction
              default: north
          appearances:
            east:
              auto_state: note_block
              model:
                path: minecraft:block/custom/drawer_block
                y: 90
                generation:
                  parent: minecraft:block/cube
                  textures:
                    down: minecraft:block/custom/drawer_block_bottom
                    up: minecraft:block/custom/drawer_block_top
                    north: minecraft:block/custom/drawer_block_front
                    east: minecraft:block/custom/drawer_block_side_left
                    south: minecraft:block/custom/drawer_block_back
                    west: minecraft:block/custom/drawer_block_side_right
                    particle: minecraft:block/custom/drawer_block_front
            north:
              auto_state: note_block
              model:
                path: minecraft:block/custom/drawer_block
            south:
              auto_state: note_block
              model:
                path: minecraft:block/custom/drawer_block
                y: 180
            west:
              auto_state: note_block
              model:
                path: minecraft:block/custom/drawer_block
                y: 270
          variants:
            facing=east:
              appearance: east
            facing=north:
              appearance: north
            facing=south:
              appearance: south
            facing=west:
              appearance: west
