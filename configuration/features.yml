# Génération naturelle du minerai de Sudime dans l'overworld.
# https://xiao-momi.github.io/craft-engine-wiki/configuration/worldgen_feature
#
# 4 veines par chunk, 5 blocs par veine, entre Y -64 et Y 32.
# La roche devient sudime:sudime_ore, le deepslate devient
# sudime:deepslate_sudime_ore. Ne s'applique qu'aux chunks nouvellement générés.
placed_features:
  sudime:sudime_ore:
    dimension_type:
      - minecraft:overworld
    feature:
      type: minecraft:ore
      config:
        discard_chance_on_air_exposure: 0.0
        size: 5
        targets:
          - state:
              Name: sudime:sudime_ore
            target:
              predicate_type: minecraft:tag_match
              tag: minecraft:stone_ore_replaceables
          - state:
              Name: sudime:deepslate_sudime_ore
            target:
              predicate_type: minecraft:tag_match
              tag: minecraft:deepslate_ore_replaceables
    placement:
      - type: minecraft:count
        count: 4
      - type: minecraft:in_square
      - type: minecraft:height_range
        height:
          type: minecraft:uniform
          min_inclusive:
            absolute: -64
          max_inclusive:
            absolute: 32
