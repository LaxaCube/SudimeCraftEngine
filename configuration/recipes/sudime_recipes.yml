# Recettes de craft des items en Sudime.
# Le Sudime ne se fabrique plus : il se mine (voir configuration/features.yml)
# puis se fond ou se grille à partir du minerai.
# https://xiao-momi.github.io/craft-engine-wiki/configuration/recipe
# S = lingot de Sudime (sudime:sudime_ingot), T = bâton
recipes:
  # ── Minerai → Lingot ─────────────────────────────────────────────────
  sudime:sudime_ingot_from_smelting_ore:
    type: smelting
    experience: 1.0
    category: misc
    group: sudime
    time: 200
    ingredient: sudime:sudime_ore
    result:
      id: sudime:sudime_ingot
      count: 2
  sudime:sudime_ingot_from_smelting_deepslate_ore:
    type: smelting
    experience: 1.0
    category: misc
    group: sudime
    time: 200
    ingredient: sudime:deepslate_sudime_ore
    result:
      id: sudime:sudime_ingot
      count: 2
  sudime:sudime_ingot_from_blasting_ore:
    type: blasting
    experience: 1.0
    category: misc
    group: sudime
    time: 100
    ingredient: sudime:sudime_ore
    result:
      id: sudime:sudime_ingot
      count: 2
  sudime:sudime_ingot_from_blasting_deepslate_ore:
    type: blasting
    experience: 1.0
    category: misc
    group: sudime
    time: 100
    ingredient: sudime:deepslate_sudime_ore
    result:
      id: sudime:sudime_ingot
      count: 2

  # ── Armure ───────────────────────────────────────────────────────────
  sudime:sudime_helmet:
    type: shaped
    category: equipment
    group: sudime_armor
    unlock_on_join: true
    pattern:
      - "SSS"
      - "S S"
    ingredients:
      S: sudime:sudime_ingot
    result:
      id: sudime:sudime_helmet
      count: 1

  sudime:sudime_chestplate:
